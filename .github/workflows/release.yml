name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Extract and validate version
        id: version
        run: |
          tag_ver="${GITHUB_REF_NAME#v}"
          cmake_ver=$(grep -oP 'project\(qZypper VERSION \K[0-9.]+' CMakeLists.txt)
          if [ "$tag_ver" != "$cmake_ver" ]; then
            echo "::error::Tag version ($tag_ver) does not match CMakeLists.txt version ($cmake_ver)"
            exit 1
          fi
          echo "VERSION=$tag_ver" >> "$GITHUB_OUTPUT"
          echo "Version: $tag_ver"

  build-rpm-leap16:
    needs: validate
    runs-on: ubuntu-latest
    container:
      image: opensuse/leap:16.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        run: |
          zypper --non-interactive --gpg-auto-import-keys refresh
          zypper --non-interactive install -y \
            cmake gcc-c++ pkg-config rpm-build \
            qt6-core-devel qt6-gui-devel \
            qt6-declarative-devel qt6-quickcontrols2-devel \
            qt6-dbus-devel qt6-svg-devel qt6-linguist-devel \
            libzypp-devel libpolkit-qt6-1-devel \
            libboost_thread-devel \
            selinux-policy-devel checkpolicy policycoreutils

      - name: Build
        run: |
          cmake -B build \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF
          cmake --build build --parallel $(nproc)

      - name: Package RPM
        run: |
          cd build
          cpack -G RPM

      - name: Verify RPM dependencies
        run: |
          cd build
          echo "=== RPM Requires ==="
          rpm -qpR *.rpm
          echo "=== RPM Provides ==="
          rpm -qp --provides *.rpm

      - name: Rename artifact
        run: |
          cd build
          arch=$(uname -m)
          for f in *.rpm; do
            mv "$f" "qzypper-${{ needs.validate.outputs.version }}-leap16.${arch}.rpm"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rpm-leap16
          path: build/*.rpm

  build-rpm-tumbleweed:
    needs: validate
    runs-on: ubuntu-latest
    container:
      image: opensuse/tumbleweed
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        run: |
          zypper --non-interactive --gpg-auto-import-keys refresh
          zypper --non-interactive install -y \
            cmake gcc-c++ pkg-config rpm-build \
            qt6-core-devel qt6-gui-devel \
            qt6-declarative-devel qt6-quickcontrols2-devel \
            qt6-dbus-devel qt6-svg-devel qt6-linguist-devel \
            libzypp-devel libpolkit-qt6-1-devel \
            libboost_thread-devel \
            selinux-policy-devel checkpolicy policycoreutils

      - name: Build
        run: |
          cmake -B build \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF
          cmake --build build --parallel $(nproc)

      - name: Package RPM
        run: |
          cd build
          cpack -G RPM

      - name: Verify RPM dependencies
        run: |
          cd build
          echo "=== RPM Requires ==="
          rpm -qpR *.rpm
          echo "=== RPM Provides ==="
          rpm -qp --provides *.rpm

      - name: Rename artifact
        run: |
          cd build
          arch=$(uname -m)
          for f in *.rpm; do
            mv "$f" "qzypper-${{ needs.validate.outputs.version }}-tumbleweed.${arch}.rpm"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rpm-tumbleweed
          path: build/*.rpm

  release:
    needs: [validate, build-rpm-leap16, build-rpm-tumbleweed]
    runs-on: ubuntu-latest
    env:
      RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
      RPM_GPG_PASSPHRASE: ${{ secrets.RPM_GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Check RPM GPG config
        id: rpm-gpg
        run: |
          if [ -n "${RPM_GPG_PRIVATE_KEY:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RPM_GPG_PRIVATE_KEY is not set - publishing unsigned RPMs"
          fi

      - name: Sign RPMs with GPG
        if: steps.rpm-gpg.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm gnupg
          export GNUPGHOME="$(mktemp -d)"
          RPMVERIFYDB="$(mktemp -d)"
          trap 'rm -rf "$GNUPGHOME" "$RPMVERIFYDB"' EXIT
          printf '%s\n' "$RPM_GPG_PRIVATE_KEY" | gpg --batch --import
          KEYID="$(gpg --batch --list-keys --with-colons | awk -F: '/^pub:/ { getline; print $10; exit }')"
          test -n "$KEYID"
          {
            printf '%%_gpg_name %s\n' "$KEYID"
            printf '%%_gpgbin %s\n' /usr/bin/gpg
            printf '%%__gpg_sign_cmd %s\n' '%{__gpg} gpg --force-mdc --batch --no-verbose --no-armor --pinentry-mode loopback --passphrase-fd 3 --no-secmem-warning -u "%{_gpg_name}" -sbo %{__signature_filename} %{__plaintext_filename}'
          } > ~/.rpmmacros
          rpmsign --addsign artifacts/*.rpm 3<<< "${RPM_GPG_PASSPHRASE:-}"
          gpg --armor --export "$KEYID" > artifacts/RPM-GPG-KEY-qZypper

          # "rpm -K"コマンドは、GnuPGのキーリングではなく、rpmdbのキーリングに対して検証するため、
          # エクスポートした公開鍵を使い捨てのrpmdbに取り込んでから新たに追加した署名を検証する
          rpm --dbpath "$RPMVERIFYDB" --initdb
          rpm --dbpath "$RPMVERIFYDB" --import artifacts/RPM-GPG-KEY-qZypper
          rpm --dbpath "$RPMVERIFYDB" -Kv artifacts/*.rpm

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum *.rpm > SHA256SUMS
          cat SHA256SUMS

      - name: Sign SHA256SUMS with GPG
        if: steps.rpm-gpg.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$RPM_GPG_PRIVATE_KEY" | gpg --batch --import
          KEYID="$(gpg --batch --list-keys --with-colons | awk -F: '/^pub:/ { getline; print $10; exit }')"
          test -n "$KEYID"
          cd artifacts
          gpg --batch --pinentry-mode loopback --passphrase-fd 3 -u "$KEYID" \
            --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS 3<<< "${RPM_GPG_PASSPHRASE:-}"
          gpg --batch --verify SHA256SUMS.asc SHA256SUMS

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "qZypper ${{ needs.validate.outputs.version }}" \
            --generate-notes \
            artifacts/*
