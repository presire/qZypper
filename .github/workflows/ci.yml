name: Backend CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [opensuse/tumbleweed, 'opensuse/leap:16.0']
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install dependencies
        run: |
          zypper --non-interactive --gpg-auto-import-keys refresh
          zypper --non-interactive install -y \
            cmake gcc-c++ pkg-config rpm-build \
            qt6-core-devel qt6-gui-devel \
            qt6-declarative-devel qt6-quickcontrols2-devel \
            qt6-dbus-devel qt6-svg-devel qt6-linguist-devel qt6-test-devel \
            libzypp-devel libpolkit-qt6-1-devel libboost_thread-devel \
            selinux-policy-devel checkpolicy policycoreutils
      - name: Build GUI, backend and all tests
        run: |
          cmake -B build/ci -S . -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          cmake --build build/ci --parallel 2
      - name: Test without package changes
        run: ctest --test-dir build/ci --output-on-failure
